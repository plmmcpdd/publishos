name: Build & Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the installers'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd client && npm install
        shell: bash
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: cd client && npm run build:win
        shell: bash
        env:
          VITE_API_URL: "http://104.238.181.32:3000/v1"
      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: cd client && npm run build:mac
        shell: bash
        env:
          VITE_API_URL: "http://104.238.181.32:3000/v1"
      - name: List release files
        run: ls -la client/release/
        shell: bash
      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PublishOS-Windows-Installer
          path: client/release/*.exe
          retention-days: 3
      - name: Upload Mac DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PublishOS-Mac-DMG
          path: client/release/*.dmg
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('PublishOS {0}', github.ref_name) || format('PublishOS Build {0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/PublishOS-Windows-Installer/*.exe
            artifacts/PublishOS-Mac-DMG/*.dmg
