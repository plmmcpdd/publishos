name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd client && npm install
        shell: bash
      - name: Build Windows
        run: cd client && npm run build:win
        shell: bash
        env:
          VITE_API_URL: "http://104.238.181.32:3000/v1"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publishos-windows
          path: client/release/
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PublishOS ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/publishos-windows/**/*.exe
