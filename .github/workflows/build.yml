name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd client && npm install
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: cd client && npm run build:win
        env:
          VITE_API_URL: http://104.238.181.32:3000/v1
      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: cd client && npm run build:mac
        env:
          VITE_API_URL: http://104.238.181.32:3000/v1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publishos-${{ matrix.os }}
          path: client/release/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "PublishOS Build ${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/publishos-windows-latest/**/*.exe
            artifacts/publishos-macos-latest/**/*.dmg
